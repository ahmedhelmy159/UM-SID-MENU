<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174F31">
  <title>UM SID — قائمة المشروبات | Beverage Menu</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <div class="header__inner">
      <img class="header__logo" src="assets/logo.png" alt="UM SID Oriental Food" width="72" height="72">
      <div class="header__titles">
        <h1 class="header__title" data-i18n="menuTitle">قائمة المشروبات</h1>
        <p class="header__sub">HADABA UM SID</p>
      </div>
      <div class="lang" role="group" aria-label="Language / اللغة">
        <button type="button" class="lang__btn is-active" data-lang="ar" lang="ar" aria-pressed="true">العربية</button>
        <button type="button" class="lang__btn" data-lang="en" lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <main class="main">

    <section class="table-panel" aria-labelledby="table-label">
      <label id="table-label" class="table-panel__label" for="table-number" data-i18n="tableLabel">رقم الطاولة</label>
      <input id="table-number" class="table-panel__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="—" aria-describedby="table-hint table-error" required>
      <p id="table-hint" class="table-panel__hint" data-i18n="tableHint">اكتب رقم الطاولة الموجود أمامك</p>
      <p id="table-error" class="table-panel__error" role="alert" hidden></p>
    </section>

    <nav class="catnav" aria-label="Categories">
      <div class="catnav__scroll" id="catnav"></div>
    </nav>

    <div class="menu" id="menu"></div>

  </main>

  <footer class="footer">
    <img class="footer__logo" src="assets/logo.png" alt="UM SID Oriental Food" width="96" height="96">
    <p class="footer__name">HADABA UM SID</p>
    <a class="footer__phone" href="tel:+201011112222" dir="ltr">010 1111 2222</a>
  </footer>

  <div class="cartbar" id="cartbar" hidden>
    <button type="button" class="cartbar__btn" id="cartbar-open">
      <span class="cartbar__count-wrap">
        <svg class="cartbar__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 8H6.3"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
        <span class="cartbar__count" id="cartbar-count">0</span>
      </span>
      <span class="cartbar__label" data-i18n="reviewOrder">مراجعة الطلب</span>
      <span class="cartbar__total" id="cartbar-total">0</span>
    </button>
  </div>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer__backdrop" id="drawer-backdrop"></div>
    <section class="drawer__sheet" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer__handle" aria-hidden="true"></div>
      <div class="drawer__head">
        <h2 id="drawer-title" class="drawer__title" data-i18n="yourOrder">طلبك</h2>
        <button type="button" class="drawer__close" id="drawer-close" data-i18n-aria="close" aria-label="إغلاق">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
        </button>
      </div>
      <div class="drawer__body" id="drawer-body"></div>
      <div class="drawer__foot">
        <div class="drawer__row">
          <span data-i18n="tableLabel">رقم الطاولة</span>
          <strong id="drawer-table" dir="ltr">—</strong>
        </div>
        <div class="drawer__row drawer__row--total">
          <span data-i18n="orderTotal">إجمالي الطلب</span>
          <strong id="drawer-total">0</strong>
        </div>
        <p class="drawer__error" id="drawer-error" role="alert" hidden></p>
        <button type="button" class="wa-btn" id="wa-send">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 1.8a8.2 8.2 0 1 1-4.2 15.3l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 0 1 12 3.8Zm-3.3 4.3c-.2 0-.5 0-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3 2.4 1 2.9.8 3.4.7.5 0 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3l-2-1c-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6Z"/></svg>
          <span data-i18n="sendWhatsApp">إرسال الطلب عبر واتساب</span>
        </button>
        <p class="drawer__note" data-i18n="confirmNote">سيفتح واتساب برسالة الطلب جاهزة، اضغط إرسال لتأكيد الطلب.</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
